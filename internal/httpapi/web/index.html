<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MagpieSync 本地视频收藏与媒体库。">
  <meta name="theme-color" content="#f6f6f3">
  <meta name="robots" content="noindex,nofollow">
  <meta property="og:title" content="MagpieSync">
  <meta property="og:description" content="把视频收藏留在自己的硬盘里。">
  <title>MagpieSync</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="./brand-logo.png">
  <link rel="preload" href="./fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#main-scroll">跳到主要内容</a>

  <section id="auth-page" class="auth-page">
    <header class="auth-top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><img src="./brand-logo.png" alt=""></span>
        <span class="brand-copy"><strong>MagpieSync</strong><small>私人视频档案</small></span>
      </div>
      <p class="auth-local"><span class="status-dot"></span>本地服务 · 127.0.0.1</p>
    </header>

    <div class="auth-main">
      <div class="auth-panel">
        <h2 id="login-title">登录</h2>
        <form id="local-login-form" class="auth-form" novalidate>
          <label class="field">本地密码
            <input id="login-password" type="password" autocomplete="current-password" required>
          </label>
          <label class="field" id="confirm-wrap" hidden>确认密码
            <input id="login-password2" type="password" autocomplete="new-password">
          </label>
          <p id="login-error" class="field-error" role="alert" hidden></p>
          <button id="login-submit" class="btn primary btn-block" type="submit">登录</button>
        </form>
      </div>
    </div>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <aside id="nav" class="rail">
      <div class="rail-head">
        <button class="brand brand-button" data-view="dashboard" type="button" aria-label="回到总览">
          <span class="brand-mark" aria-hidden="true"><img src="./brand-logo.png" alt=""></span>
          <span class="brand-copy"><strong>MagpieSync</strong><small>私人视频档案</small></span>
        </button>
      </div>
      <nav class="rail-nav" aria-label="主导航">
        <p class="rail-label">工作台</p>
        <button class="nav-item" data-view="dashboard" type="button"><svg class="icon" aria-hidden="true"><use href="./icons.svg#squares-four"></use></svg><span class="nav-text">总览</span></button>
        <button class="nav-item" data-view="library" type="button"><svg class="icon" aria-hidden="true"><use href="./icons.svg#books"></use></svg><span class="nav-text">资料库</span><span id="download-nav-count" class="nav-count" hidden></span></button>
        <button class="nav-item" data-view="downloads" type="button"><svg class="icon" aria-hidden="true"><use href="./icons.svg#download-simple"></use></svg><span class="nav-text">下载</span></button>
        <button class="nav-item" data-view="runs" type="button"><svg class="icon" aria-hidden="true"><use href="./icons.svg#clock-counter-clockwise"></use></svg><span class="nav-text">同步记录</span></button>
        <p class="rail-label">系统</p>
        <button class="nav-item" data-view="settings" type="button"><svg class="icon" aria-hidden="true"><use href="./icons.svg#sliders-horizontal"></use></svg><span class="nav-text">设置</span></button>
      </nav>
      <div class="rail-foot">
        <button id="logout-btn" class="rail-logout" type="button">退出本地会话</button>
      </div>
    </aside>
    <div id="sidebar-backdrop" class="rail-backdrop" hidden></div>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="打开导航" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="./icons.svg#list"></use></svg></button>
          <strong id="page-title" class="page-title">总览</strong>
        </div>
        <div class="topbar-right">
          <button id="sync-indicator" class="sync-indicator" type="button" hidden><span class="sync-pulse"></span><span id="sync-indicator-text">同步中</span></button>
        </div>
      </header>

      <main id="main-scroll" tabindex="-1">
        <div id="reauth-banner" class="reauth-banner" hidden></div>

        <div id="account-wrap" class="account-wrap" hidden>
          <button id="account-switch-btn" class="account-switch" type="button" aria-haspopup="true" aria-expanded="false"></button>
          <div id="account-menu" class="account-menu" hidden></div>
        </div>

        <section id="view-dashboard" class="view" hidden>
          <header class="page-head">
            <div class="page-head-copy">
              <h1>总览</h1>
              <p id="dashboard-lede" class="page-lede"></p>
            </div>
            <div class="page-actions">
              <button id="dashboard-open-library" class="btn ghost" type="button">打开资料库</button>
              <button id="sync-all" class="btn primary" type="button"><svg class="icon" aria-hidden="true"><use href="./icons.svg#arrows-clockwise"></use></svg>同步全部</button>
            </div>
          </header>

          <div id="progress" class="progress-strip" hidden>
            <div class="progress-copy"><span id="progress-text"></span><span id="progress-pct" class="progress-pct"></span></div>
            <div class="progress-track"><div id="progress-fill"></div></div>
          </div>

          <div class="dashboard-grid">
            <section class="ledger" aria-labelledby="ledger-title">
              <div class="section-head">
                <h2 id="ledger-title">本地档案</h2>
                <span class="section-note">跨站点汇总</span>
              </div>
              <div id="stats" class="ledger-list"></div>
              <div class="ledger-foot">
                <button class="text-link" id="ledger-open-library" type="button">查看全部视频<svg class="icon" aria-hidden="true"><use href="./icons.svg#arrow-right"></use></svg></button>
              </div>
            </section>
            <section id="last-run-panel" class="last-run" aria-labelledby="last-run-title"></section>
          </div>

          <div class="dashboard-columns">
            <aside id="attention-panel" class="panel-flat attention" aria-labelledby="attention-title">
              <div class="section-head">
                <h2 id="attention-title">需要处理</h2>
              </div>
              <div id="attention-list" class="attention-list"></div>
            </aside>
            <section class="panel-flat" aria-labelledby="recent-runs-title">
              <div class="section-head">
                <h2 id="recent-runs-title">最近同步</h2>
                <button class="text-link" data-view="runs" type="button">全部记录<svg class="icon" aria-hidden="true"><use href="./icons.svg#arrow-right"></use></svg></button>
              </div>
              <div id="recent-runs" class="runs-compact"></div>
            </section>
          </div>
        </section>

        <section id="view-library" class="view" hidden>
          <header class="page-head">
            <div class="page-head-copy">
              <h1>资料库</h1>
              <p id="library-lede" class="page-lede"></p>
            </div>
            <div class="page-actions">
              <button id="library-download" class="btn ghost" type="button" hidden>下载未备份</button>
              <button id="library-sync" class="btn primary" type="button"><svg class="icon" aria-hidden="true"><use href="./icons.svg#arrows-clockwise"></use></svg>同步此账户</button>
            </div>
          </header>

          <div id="library-progress" class="progress-line" hidden>
            <span id="library-progress-text"></span>
            <div class="progress-track"><div id="library-progress-fill"></div></div>
          </div>

          <div class="library-layout">
            <aside class="source-panel">
              <div class="source-panel-head">
                <h2>来源</h2>
              <button id="source-add" class="icon-btn" type="button" aria-label="添加来源" title="添加来源" hidden><svg class="icon" aria-hidden="true"><use href="./icons.svg#plus"></use></svg></button>
              </div>
              <label class="mobile-source-picker">
                <span>当前来源</span>
                <select id="mobile-source-select" aria-label="选择视频来源"></select>
              </label>
              <div id="source-list" class="source-list"></div>
            </aside>

            <section class="library-main" aria-labelledby="library-title">
              <div class="library-tools">
                <div class="library-title-block">
                  <h2 id="library-title">全部视频</h2>
                  <span id="library-count" class="library-count"></span>
                </div>
                <div class="library-filters">
                  <label class="search-box">
                    <svg class="icon" aria-hidden="true"><use href="./icons.svg#magnifying-glass"></use></svg>
                    <input id="search-input" type="search" placeholder="搜索标题、作者、简介" aria-label="搜索视频">
                  </label>
                  <label class="library-filter-field">
                    <span>远端状态</span>
                    <select id="remote-state-filter">
                      <option value="">全部</option>
                      <option value="active">正常收藏</option>
                      <option value="missing">远端缺失待确认</option>
                      <option value="removed">远端已移除</option>
                    </select>
                  </label>
                  <label class="library-filter-field">
                    <span>备份状态</span>
                    <select id="local-state-filter">
                      <option value="">全部</option>
                      <option value="none">未下载</option>
                      <option value="pending">等待下载</option>
                      <option value="running">下载中</option>
                      <option value="paused">已暂停</option>
                      <option value="done">已备份</option>
                      <option value="partial">部分备份</option>
                      <option value="failed">下载失败</option>
                      <option value="missing">本地文件丢失</option>
                    </select>
                  </label>
                  <select id="sort-select" aria-label="排序方式">
                    <option value="favorited">按收藏时间</option>
                    <option value="recent">按发现时间</option>
                    <option value="published">按发布时间</option>
                    <option value="title">按标题</option>
                  </select>
                </div>
              </div>
              <p id="source-delete-result" class="source-delete-result" role="status" aria-live="polite" hidden></p>
              <div id="source-archive-notice" class="source-archive-notice" hidden>
                <p>此来源已归档，不再同步，本地备份已保留。</p>
                <button id="source-archive-delete" class="text-link" type="button">删除本地来源</button>
              </div>
              <div id="items-grid" class="items-grid"></div>
              <div id="pager" class="pager"></div>
            </section>
          </div>
        </section>

        <section id="view-downloads" class="view" hidden>
          <header class="page-head">
            <div class="page-head-copy">
              <h1>下载</h1>
            </div>
            <div class="page-actions">
              <button id="downloads-refresh" class="btn ghost" type="button">刷新</button>
            </div>
          </header>

          <div class="queue-toolbar">
            <div class="filter-tabs" id="download-filters" role="tablist" aria-label="下载状态筛选"></div>
            <button id="retry-failed" class="btn ghost small" type="button" hidden>重试全部失败</button>
          </div>

          <div id="downloads-list" class="download-list"></div>
          <p id="download-media-dir" class="media-note"></p>
        </section>

        <section id="view-runs" class="view" hidden>
          <header class="page-head">
            <div class="page-head-copy">
              <h1>同步记录</h1>
              <p id="runs-lede" class="page-lede">每次只读同步的结果、变更与错误都记录在这里。</p>
            </div>
            <div class="page-actions">
              <select id="run-filter" aria-label="按结果筛选">
                <option value="">全部结果</option>
                <option value="success">成功</option>
                <option value="partial">部分完成</option>
                <option value="suspicious">疑似异常</option>
                <option value="failed">失败</option>
                <option value="aborted">已中止</option>
              </select>
              <button id="runs-refresh" class="btn ghost" type="button">刷新</button>
            </div>
          </header>
          <div class="runs-table" id="runs-table-wrap"></div>
        </section>

        <section id="view-settings" class="view" hidden>
          <header class="page-head">
            <div class="page-head-copy">
              <h1>设置</h1>
            </div>
            <div class="page-actions settings-actions">
              <span id="settings-state" class="save-state">所有修改已保存</span>
              <button id="settings-save" class="btn primary" type="button" disabled>保存修改</button>
            </div>
          </header>

          <div class="settings-layout">
            <nav class="settings-nav" aria-label="设置分区">
              <button class="settings-nav-item" type="button" data-settings-section="general">常规</button>
              <button class="settings-nav-item" type="button" data-settings-section="download">下载</button>
              <button class="settings-nav-item" type="button" data-settings-section="accounts">站点与账户</button>
            </nav>

            <div class="settings-body">
              <section class="settings-panel" data-settings-panel="general" hidden>
                <div class="settings-sub"><div class="settings-sub-head"><h3>媒体存储</h3></div></div>
                <div class="settings-fields">
                  <label class="field field-wide">媒体目录
                    <input id="set-media-dir" type="text" placeholder="D:\Media\MagpieSync">
                  </label>
                  <label class="field field-wide">FFmpeg 路径
                    <input id="set-ffmpeg" type="text" placeholder="ffmpeg 或完整路径">
                    <small id="ffmpeg-status" class="field-note"></small>
                  </label>
                </div>
                <header class="settings-panel-head">
                  <h2>定时同步</h2>
                  <span id="schedule-live" class="schedule-badge">当前已关闭</span>
                </header>
                <label class="schedule-toggle"><span>开启定时同步</span><input id="schedule-enabled" type="checkbox" role="switch" aria-controls="schedule-editor" aria-expanded="false"><span class="schedule-switch" aria-hidden="true"></span></label>
                <div id="schedule-editor" class="schedule-editor" hidden>
                  <label class="schedule-label" for="set-sync-schedule">同步计划</label>
                  <div class="schedule-presets" aria-label="常用计划">
                    <button class="btn ghost" type="button" data-schedule="0 4 * * *" aria-pressed="false">每天凌晨 04:00</button>
                    <button class="btn ghost" type="button" data-schedule="0 */6 * * *" aria-pressed="false">每 6 小时</button>
                    <button class="btn ghost" type="button" data-schedule="0 4 * * 0" aria-pressed="false">每周日 04:00</button>
                  </div>
                  <div class="schedule-input-row">
                    <input id="set-sync-schedule" type="text" placeholder="例如 0 4 * * *" autocomplete="off" spellcheck="false" aria-describedby="schedule-help schedule-error" aria-invalid="false">
                    <button id="schedule-clear" class="btn ghost" type="button">清空</button>
                  </div>
                  <div id="schedule-help" class="schedule-help"><span>分钟 · 小时 · 日 · 月 · 星期</span></div>
                  <p id="schedule-error" class="schedule-error" role="alert" hidden></p>
                  <div class="schedule-preview" aria-live="polite">
                    <span id="schedule-preview-label">计划预览</span>
                    <h3 id="schedule-title">按需手动同步</h3>
                    <div class="schedule-next">
                      <span>接下来 5 次执行</span>
                      <ol id="schedule-runs" class="schedule-runs"><li>未安排定时任务</li></ol>
                    </div>
                  </div>
                </div>
                <div class="settings-sub">
                  <div class="settings-sub-head">
                    <h3>数据导出</h3>
                  </div>
                  <div class="export-row">
                    <a class="btn ghost" href="./api/export?format=json">导出全部 JSON</a>
                    <a class="btn ghost" href="./api/export?format=csv">导出全部 CSV</a>
                  </div>
                </div>
              </section>

              <section class="settings-panel" data-settings-panel="download" hidden>
                <header class="settings-panel-head">
                  <h2>下载</h2>
                </header>
                <div class="settings-fields">
                  <label class="field">并发下载数
                    <input id="set-concurrency" type="number" min="1" max="8">
                    <small>同时下载的视频数量，1 到 8。</small>
                  </label>
                  <label class="field">编码优先级
                    <input id="set-codecs" type="text" placeholder="avc,hevc,av1">
                    <small>按从左到右的顺序选择，留空会使用默认顺序。</small>
                  </label>
                </div>
                <div class="settings-sub">
                  <div class="settings-sub-head">
                    <h3>分片</h3>
                  </div>
                  <div class="settings-fields">
                    <label class="field">分片并发数
                      <input id="set-chunk-concurrency" type="number" min="1" max="8">
                      <small>单个视频同时抓取的分片数量。</small>
                    </label>
                    <label class="field">分片阈值（MB）
                      <input id="set-chunk-threshold" type="number" min="0" max="4096">
                      <small>超过这个体积才启用分片，0 表示自动。</small>
                    </label>
                  </div>
                </div>
              </section>

              <section class="settings-panel" data-settings-panel="accounts" hidden>
                <header class="settings-panel-head">
                  <h2>站点与账户</h2>
                </header>
                <div id="set-site-accounts" class="site-card-list"><p class="field-note">正在读取站点…</p></div>
              </section>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <div>
          <p id="modal-kicker" class="eyebrow"></p>
          <h2 id="modal-title"></h2>
        </div>
        <button id="modal-close" class="icon-btn" type="button" aria-label="关闭"><svg class="icon" aria-hidden="true"><use href="./icons.svg#x"></use></svg></button>
      </header>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="./app.js" defer></script>
</body>
</html>
